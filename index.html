// Standalone practice exam. All marking happens locally; no scores are sent to a server.
// Increment this key when publishing a different question set.
const KEY='nlts-mgmt2023-midsemester-pencil-v1';
const DURATION=60*60*1000;
const app=document.getElementById('app');
const dialog=document.getElementById('confirm');
let state=null, interval=null, storageOK=true;
let celebrationTimeout=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function valid(s){return s&&s.version===1&&typeof s.name==='string'&&Number.isFinite(s.deadline)&&Number.isFinite(s.started)&&Number.isInteger(s.index)&&s.index>=0&&s.index<questions.length&&Array.isArray(s.answers)&&s.answers.length===questions.length&&s.answers.every((a,i)=>a===null||(Number.isInteger(a)&&a>=0&&a<questions[i].options.length))&&(s.done||s.answers.slice(0,s.index).every(a=>a!==null))&&typeof s.done==='boolean';}
function applyDuration(s){if(!s.done)s.deadline=s.started+DURATION;return s;}
try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);if(valid(saved))state=applyDuration(saved);}}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;const n=document.getElementById('storageWarning');if(n)n.classList.remove('hidden');}}
function remaining(){return Math.max(0,Math.ceil((state.deadline-Date.now())/1000));}
function start(){const name=document.getElementById('studentName').value.trim();if(!name){document.getElementById('nameError').textContent='Please enter your name before starting.';document.getElementById('studentName').focus();return;}const t=Date.now();state={version:1,name,started:t,deadline:t+DURATION,index:0,answers:Array(30).fill(null),done:false};save();renderQuestion();runTimer();}
function intro(){app.innerHTML=`<div class="intro"><section><div class="eyebrow">MGMT2023 · Practice examination</div><h1>Midsemester<br>Mock Exam</h1><p class="muted">Build your confidence with 30 challenging original questions based on the supplied financial statements, retirement example and midsemester guidance.</p><div class="stats"><div class="stat"><strong>30</strong><span>Multiple choice questions</span></div><div class="stat"><strong>60</strong><span>Minutes to complete</span></div><div class="stat"><strong>1</strong><span>Mark per question</span></div></div><p><strong>No limits to what you can achieve.</strong></p></section><section class="panel"><div class="eyebrow">Before you begin</div><h2>Your exam instructions</h2><ol class="rules"><li>Each page shows one question with its complete scenario and any required financial statements.</li><li>Choose one answer, then select <strong>Save & continue</strong>. You cannot return to an earlier question.</li><li>There is no skip button. You must select an answer before continuing.</li><li>The timer begins when you start. It continues if you refresh or leave the page.</li><li>Your exam submits automatically when time expires. Answers and explanations appear only after submission.</li><li>A scientific calculator is permitted. Round only your final answer as requested. All amounts are Jamaican dollars. Use 365 days for collection periods. Use average balances only where the question requests them. Keep intermediate calculations unrounded and round the final answer as instructed.</li><li>After submission, you may start another attempt with a fresh one hour timer.</li></ol><form id="startForm"><label class="name" for="studentName">Student name</label><input id="studentName" type="text" maxlength="100" autocomplete="name" placeholder="Enter your full name" required><p id="nameError" class="error" role="alert"></p><button class="btn wide" type="submit">Start mock exam <span aria-hidden="true">→</span></button></form><p class="note">Your name and responses stay in this browser. Results are not sent to NLTS. Use your own browser profile on a shared device.</p><p class="error ${storageOK?'hidden':''}">Browser storage is unavailable. Keep this page open to preserve your attempt.</p></section></div>`;document.getElementById('startForm').onsubmit=e=>{e.preventDefault();start();};}
function renderQuestion(){if(state.done){results();return;}if(remaining()===0){finish(true);return;}const q=questions[state.index];app.innerHTML=`<div class="topbar"><div><div class="eyebrow">Midsemester Mock Exam</div><strong>${esc(state.name)}</strong></div><div class="timer" id="timer" role="timer" aria-label="Time remaining"><small>TIME REMAINING</small><strong id="clock">60:00</strong></div></div><div class="progress" role="progressbar" aria-label="Questions completed" aria-valuemin="0" aria-valuemax="30" aria-valuenow="${state.index}"><span style="width:${state.index/30*100}%"></span></div><div class="examgrid"><aside class="side"><div class="panel"><div class="eyebrow">Your progress</div><h2>${state.index+1} <span class="muted">/ 30</span></h2><h3>Forward only</h3><p>Once you continue, this question is locked.</p><h3>One best answer</h3><p>Each correct answer earns one mark. No marks are deducted for an incorrect response.</p><p>Answers become available after you submit.</p></div></aside><section class="panel" aria-labelledby="questionTitle"><span class="tag">Question ${state.index+1}</span><div class="scenario"><div class="eyebrow">Scenario</div><p>${esc(q.scenario)}</p></div>${q.visual}<h2 id="questionTitle" tabindex="-1">${esc(q.prompt)}</h2><fieldset class="options"><legend>Select one answer for question ${state.index+1}</legend>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${state.answers[state.index]===i?'checked':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></label>`).join('')}</fieldset><div class="actions"><button class="btn" id="next" ${state.answers[state.index]===null?'disabled':''}>${state.index===29?'Submit exam':'Save & continue'} <span aria-hidden="true">→</span></button></div><p id="storageWarning" class="error ${storageOK?'hidden':''}" role="alert">Browser storage is unavailable. Keep this page open to preserve your attempt.</p><p class="note">Question ${state.index+1} of 30 · No return to previous questions</p></section></div><p id="timeNotice" class="error" role="status"></p>`;app.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{if(remaining()===0){finish(true);return;}state.answers[state.index]=Number(el.value);save();document.getElementById('next').disabled=false;});document.getElementById('next').onclick=()=>advance();tick();}
function advance(){if(state.done)return;if(remaining()===0){finish(true);return;}if(state.answers[state.index]===null)return;if(state.index===29){document.getElementById('confirmText').textContent=`You have answered ${state.answers.filter(a=>a!==null).length} of 30 questions. Your score and correct answers will appear after submission.`;dialog.showModal();return;}state.index++;save();renderQuestion();window.scrollTo(0,0);document.getElementById('questionTitle')?.focus({preventScroll:true});}
function tick(){if(!state||state.done)return;const secs=remaining();if(secs===0){finish(true);return;}const clock=document.getElementById('clock');if(clock)clock.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');document.getElementById('timer')?.classList.toggle('urgent',secs<=300);const notice=document.getElementById('timeNotice');if(notice&&secs<=300&&!notice.textContent)notice.textContent='Five minutes or less remain. Your exam will submit automatically when the timer reaches zero.';}
function runTimer(){clearInterval(interval);tick();if(!state.done)interval=setInterval(tick,250);}
function finish(timeout){if(!state||state.done)return;state.done=true;state.timedOut=!!timeout||remaining()===0;state.finished=Date.now();save();clearInterval(interval);if(dialog.open)dialog.close();results();window.scrollTo(0,0);}
function gradeFeedback(score){const percent=score/questions.length*100;if(score===questions.length)return {icon:'',title:'Perfect score! Congratulations!',message:'You answered every question correctly. Celebrate your achievement!'};if(percent>=80)return {icon:'',title:'Excellent performance!',message:'You are doing very well. Review your missed questions and aim for 100%.'};if(percent>=70)return {icon:'',title:'Good work!',message:'You have a strong foundation. Review the explanations and practise again.'};if(percent>=50)return {icon:'',title:'Keep building your confidence!',message:'Review your incorrect answers, work through the explanations and try again.'};return {icon:'',title:'Every attempt is a chance to improve.',message:'Take your time with the explanations. Practise each calculation and return for another attempt.'};}
function clearCelebration(){clearTimeout(celebrationTimeout);document.getElementById('celebration')?.remove();}

function retry(){if(!state||!state.done)return;clearCelebration();clearInterval(interval);const name=state.name;const attempt=(Number.isInteger(state.attempt)?state.attempt:1)+1;state=null;intro();document.getElementById('studentName').value=name;const form=document.getElementById('startForm');form.onsubmit=e=>{e.preventDefault();start();if(state){state.attempt=attempt;save();}};window.scrollTo(0,0);document.getElementById('studentName').focus();}
function results(){const score=questions.reduce((sum,q,i)=>sum+(state.answers[i]===q.answer?1:0),0);const feedback=gradeFeedback(score);const answered=state.answers.filter(a=>a!==null).length;const mins=Math.min(60,Math.max(0,Math.ceil(((state.finished||state.deadline)-state.started)/60000)));app.innerHTML=`<section class="resulthead"><div><div class="eyebrow">Exam complete · Attempt ${state.attempt||1}</div><h1 style="font-size:34px;margin:12px 0">${esc(state.name)}, here are your results.</h1><p class="muted">${state.timedOut?'Time expired. Your saved responses were submitted automatically.':'Your exam has been submitted.'}</p><div class="grade-message">${feedback.title}</div><p class="muted">${feedback.message}</p><p class="muted">${answered} answered · ${30-answered} unanswered · ${mins} minutes used</p></div><div><div class="score">${score}<span style="font-size:24px;color:#bfcce4"> / 30</span></div><strong>${(score/30*100).toFixed(1)}%</strong></div></section><div class="notice">Your result is saved on this browser only. Print or save it as a PDF to share it with your tutor. For information about tutoring, contact us at <a href="tel:18765692703">18765692703</a>.</div><div class="result-buttons"><button class="btn" id="retry">Try again</button><button class="btn secondary printbutton" id="print">Print results / Save as PDF</button></div><p class="note">You can attempt this quiz as many times as you like. Each new attempt starts with 60 minutes and cleared answers. The same 30 questions are used. Save your result before starting again.</p><h2 style="margin-top:32px">Answer key and explanations</h2><p class="muted">Review each scenario, your response and the correct answer.</p>${questions.map((q,i)=>{const a=state.answers[i],right=a===q.answer;return `<article class="review"><span class="tag">Question ${i+1}</span><span class="${right?'correct':'wrong'}" style="float:right;font-weight:700">${right?'Correct':'0 marks'}</span><div class="scenario"><p>${esc(q.scenario)}</p></div>${q.visual}<h3>${esc(q.prompt)}</h3><p class="${right?'correct':'wrong'}"><strong>Your answer:</strong> ${a===null?'Not answered':String.fromCharCode(65+a)+'. '+esc(q.options[a])}</p><p class="correct"><strong>Correct answer:</strong> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</p><p><strong>Explanation:</strong> ${esc(q.explanation)}</p></article>`;}).join('')}<p class="note">This is an original 30 MCQ NLTS practice exam based on the supplied examples and topic guidance, not an official university examination. It does not reproduce the official 40 MCQ plus written question structure.</p>`;document.getElementById('print').onclick=()=>window.print();document.getElementById('retry').onclick=retry;clearCelebration();}
document.getElementById('cancelSubmit').onclick=()=>dialog.close();document.getElementById('confirmSubmit').onclick=()=>finish(false);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});window.addEventListener('pageshow',tick);window.addEventListener('beforeunload',e=>{if(state&&!state.done){e.preventDefault();e.returnValue='';}});
// The exam never uses browser history to move between questions.
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const s=JSON.parse(e.newValue);if(valid(s)){state=applyDuration(s);if(state.done){clearInterval(interval);if(dialog.open)dialog.close();results();}else{renderQuestion();runTimer();}}}catch(err){}}});
if(state){if(state.done)results();else{renderQuestion();runTimer();}}else intro();
</script></body></html>
